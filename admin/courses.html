<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formations | Katsuki Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/shared.css">
</head>
<body>
  <div class="kt-shell">
    <aside id="sidebar" class="kt-sidebar"><div class="kt-brand"><span class="kt-logo">K</span><span>Katsuki<small>Admin</small></span></div><nav id="nav" class="kt-nav"></nav><nav class="kt-nav"><button onclick="KTAuth.logout()">Deconnexion</button></nav></aside>
    <main class="kt-main">
      <div class="kt-topbar"><div><button class="kt-btn kt-mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button><h1 class="kt-title">Formations</h1><p class="kt-muted">Lecture des formations publiees dans la base.</p></div></div>
      <section id="courses" class="kt-grid cols-3"></section>
    </main>
  </div>
  <script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/ui.js"></script>
  <script>
    KTAuth.checkAuth("admin");
    document.getElementById("nav").innerHTML = KTUi.sidebar("admin", "courses.html");
    KTApi.get("/courses").then((courses) => {
      document.getElementById("courses").innerHTML = courses.map((course) => `<article class="kt-card kt-card-pad"><span class="kt-badge">${KTUi.escapeHtml(course.level)}</span><h2>${KTUi.escapeHtml(course.title)}</h2><p class="kt-muted">${KTUi.escapeHtml(course.full_desc || "")}</p><p>${course.modules_count} modules - ${course.price} EUR</p><a class="kt-btn primary" href="/student/course.html?courseId=${course.id}">Previsualiser</a></article>`).join("");
    }).catch((error) => KTUi.toast(error.message));
  </script>
</body>
</html>
