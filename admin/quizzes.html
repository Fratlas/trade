<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examens | Katsuki Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/shared.css">
</head>
<body>
  <div class="kt-shell">
    <aside id="sidebar" class="kt-sidebar"><div class="kt-brand"><span class="kt-logo">K</span><span>Katsuki<small>Admin</small></span></div><nav id="nav" class="kt-nav"></nav><nav class="kt-nav"><button onclick="KTAuth.logout()">Deconnexion</button></nav></aside>
    <main class="kt-main">
      <div class="kt-topbar"><div><button class="kt-btn kt-mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button><h1 class="kt-title">Examens</h1></div><a class="kt-btn primary" href="/admin/assistant.html">Assistant IA</a></div>
      <section class="kt-grid" style="grid-template-columns:1fr 360px">
        <article class="kt-card kt-card-pad"><table class="kt-table"><thead><tr><th>Titre</th><th>Formation</th><th>Seuil</th><th>Duree</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></article>
        <aside class="kt-card kt-card-pad kt-form"><h2>Generateur IA</h2><input id="topic" class="kt-input" placeholder="Sujet"><button id="gen" class="kt-btn primary">Generer 5 questions</button><pre id="ai" class="kt-muted" style="white-space:pre-wrap"></pre></aside>
      </section>
    </main>
  </div>
  <script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/ui.js"></script><script src="/assets/js/openrouter.js"></script>
  <script>
    KTAuth.checkAuth("admin");
    document.getElementById("nav").innerHTML = KTUi.sidebar("admin", "quizzes.html");
    async function load() {
      const courses = await KTApi.get("/courses");
      const exams = (await Promise.all(courses.map(async (course) => (await KTApi.get(`/courses/${course.id}/exams`).catch(() => [])).map((e) => Object.assign(e, { course_title: course.title }))))).flat();
      document.getElementById("rows").innerHTML = exams.map((e) => `<tr><td>${KTUi.escapeHtml(e.title)}</td><td>${KTUi.escapeHtml(e.course_title)}</td><td>${e.passing_score}%</td><td>${e.duration_minutes} min</td><td><a class="kt-btn" href="/student/quiz.html?quizId=${e.id}">Tester</a></td></tr>`).join("");
    }
    document.getElementById("gen").addEventListener("click", async () => {
      const topic = document.getElementById("topic").value || "trading";
      const q = await KTAI.askQuestions(topic, "admin", 5);
      document.getElementById("ai").textContent = JSON.stringify(q, null, 2);
    });
    load().catch((error) => KTUi.toast(error.message));
  </script>
</body>
</html>
