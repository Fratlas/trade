<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ressources | Katsuki Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/shared.css">
</head>
<body>
  <div class="kt-shell">
    <aside id="sidebar" class="kt-sidebar"><div class="kt-brand"><span class="kt-logo">K</span><span>Katsuki<small>Admin</small></span></div><nav id="nav" class="kt-nav"></nav><nav class="kt-nav"><button onclick="KTAuth.logout()">Deconnexion</button></nav></aside>
    <main class="kt-main">
      <div class="kt-topbar"><div><button class="kt-btn kt-mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button><h1 class="kt-title">Ressources</h1></div></div>
      <section class="kt-grid cols-2">
        <form id="form" class="kt-card kt-card-pad kt-form">
          <h2>Uploader une ressource</h2>
          <select class="kt-select" name="type"><option value="book">PDF / Livre</option><option value="video">Video</option><option value="article">Article</option><option value="photo">Image</option><option value="webinar">Webinar</option></select>
          <input class="kt-input" name="title" placeholder="Titre" required>
          <textarea class="kt-textarea" name="description" placeholder="Description"></textarea>
          <input class="kt-input" name="media_url" placeholder="URL du fichier ou lien">
          <button class="kt-btn primary">Publier</button>
        </form>
        <section class="kt-card kt-card-pad"><h2>Bibliotheque</h2><div id="resources" class="kt-grid"></div></section>
      </section>
    </main>
  </div>
  <script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/ui.js"></script>
  <script>
    KTAuth.checkAuth("admin");
    document.getElementById("nav").innerHTML = KTUi.sidebar("admin", "resources.html");
    async function load() {
      const items = await KTApi.get("/admin/content");
      document.getElementById("resources").innerHTML = items.map((item) => `<article class="kt-card kt-card-pad"><span class="kt-badge">${KTUi.escapeHtml(item.type)}</span><h3>${KTUi.escapeHtml(item.title)}</h3><p class="kt-muted">${KTUi.escapeHtml(item.description || "")}</p></article>`).join("") || '<p class="kt-muted">Aucune ressource.</p>';
    }
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      await KTApi.post("/admin/content", Object.fromEntries(form.entries()));
      event.currentTarget.reset();
      KTUi.toast("Ressource publiee.");
      load();
    });
    load().catch((error) => KTUi.toast(error.message));
  </script>
</body>
</html>
