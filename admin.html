<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Katsuki Trading</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-zinc-950 text-white min-h-screen"><header class="border-b border-white/10 bg-zinc-900/70"><div class="max-w-6xl mx-auto px-5 py-6 flex justify-between items-center"><a class="font-black text-xl" href="index.html">KATSUKI <span class="text-red-500">TRADING</span></a><span class="text-red-300 text-sm">Espace administrateur</span></div></header><main class="max-w-6xl mx-auto px-5 py-12"><h1 class="text-4xl font-black">Tableau de bord</h1><p class="text-zinc-400 mt-2">Données directement issues de la base du site</p><div id="status" role="status" class="mt-7 text-zinc-300">Vérification des droits et chargement...</div><section id="dashboard" class="hidden"><div class="grid md:grid-cols-3 gap-5 mt-9" id="metrics"></div><h2 class="text-2xl font-bold mt-12 mb-5">Derniers comptes</h2><div class="overflow-x-auto rounded-2xl border border-white/10"><table class="w-full text-left text-sm"><thead class="bg-zinc-800"><tr><th class="p-4">ID</th><th class="p-4">Nom</th><th class="p-4">Email</th><th class="p-4">Rôle</th><th class="p-4">Inscrit le</th></tr></thead><tbody id="rows" class="divide-y divide-white/10"></tbody></table></div></section></main><script>
const status=document.querySelector('#status');const token=localStorage.getItem('katsuki_token');
const add=(parent,tag,value,classes)=>{const node=document.createElement(tag);node.textContent=String(value??'');node.className=classes||'';parent.append(node);return node};
async function load(){if(!token){status.textContent='Veuillez vous connecter depuis la page d’accueil.';return}
try{const r=await fetch('/api/admin/dashboard',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur de chargement');
const metrics=document.querySelector('#metrics');[['Utilisateurs',d.users],['Étudiants',d.students],['Administrateurs',d.admins]].forEach(([name,num])=>{const card=add(metrics,'div','','bg-zinc-900 border border-white/10 rounded-2xl p-6');add(card,'p',name,'text-zinc-400');add(card,'p',num,'text-4xl font-black mt-3 text-red-400')});
const rows=document.querySelector('#rows');d.recent_users.forEach(u=>{const tr=document.createElement('tr');[u.id,u.name,u.email,u.role,u.created_at].forEach(v=>add(tr,'td',v,'p-4'));rows.append(tr)});
status.textContent='Accès administrateur vérifié.';document.querySelector('#dashboard').classList.remove('hidden')
}catch(e){status.textContent=e.message}}load();</script></body></html>
